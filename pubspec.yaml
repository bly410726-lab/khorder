name: khorder
description: "KhOrder - Professional e-commerce ordering application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: 3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.5.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: 13.0.1
  image_picker: ^1.1.2
  mime: ^2.0.0
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/logo_app.jpg
